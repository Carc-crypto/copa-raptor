<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Panel de Administración - Copa Raptor</title>

  <link rel="stylesheet" href="admin.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js" defer></script>
</head>

<body>

  <div class="page-container">

    <!-- =========================
         LOGIN
    ========================== -->

    <section id="loginSection">

      <h2>COPA RAPTOR 2026 - ACCESO ADMIN</h2>

      <form id="loginForm">

        <div class="form-group">
          <label for="adminEmail">Correo de Administrador</label>
          <input
            type="email"
            id="adminEmail"
            placeholder="admin@coparaptor.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="adminPassword">Contraseña</label>
          <input
            type="password"
            id="adminPassword"
            placeholder="••••••••"
            required
          >
        </div>

        <button type="submit">
          Iniciar Sesión
        </button>

      </form>

      <p id="loginMessage"></p>

    </section>


    <!-- =========================
         DASHBOARD
    ========================== -->

    <div id="dashboard">

      <!-- CABECERA -->

      <header class="dashboard-header">

        <div>
          <h1>Panel - Copa Raptor</h1>
          <span class="header-subtitle">
            Administración del torneo
          </span>
        </div>

        <button id="logoutButton" class="logout">
          Cerrar Sesión
        </button>

      </header>


      <div id="dashboardMessage"></div>


      <!-- =========================
           ACCIONES
      ========================== -->

      <section class="admin-actions">

        <button
          id="btn-generate-brackets"
          class="btn-action"
        >
          ⚡ Generar Brackets
        </button>

        <button
          id="btn-reset-brackets"
          class="btn-danger"
        >
          🔄 Resetear Brackets
        </button>

      </section>


      <!-- =========================
           PARTICIPANTES
      ========================== -->

      <section class="participants-box">

        <div class="participants-box-header">

          <h2>
            Participantes Registrados
            (<span id="participantCount">0</span>)
          </h2>

        </div>

        <div id="participantsContainer">
        </div>

      </section>


      <!-- =========================
           GESTIÓN DE BRACKETS
      ========================== -->

      <section class="brackets-section">

        <div class="brackets-title">

          <h2>
            Gestión de Enfrentamientos
          </h2>

        </div>


        <div class="brackets-grid">


          <!-- WINNERS -->

          <div class="bracket-column winners-column">

            <div class="bracket-column-header">

              <h3>
                🏆 Winners Bracket
              </h3>

            </div>

            <div
              id="winners-container"
              class="sets-container"
            >
            </div>

          </div>


          <!-- LOSERS -->

          <div class="bracket-column losers-column">

            <div class="bracket-column-header">

              <h3>
                🔥 Losers Bracket
              </h3>

            </div>

            <div
              id="losers-container"
              class="sets-container"
            >
            </div>

          </div>


          <!-- GRAND FINALS -->

          <div class="bracket-column finals-column">

            <div class="bracket-column-header">

              <h3>
                🏆 Grand Finals
              </h3>

            </div>

            <div
              id="grand-finals-container"
              class="sets-container"
            >
            </div>

          </div>

        </div>

      </section>

    </div>

  </div>

</body>
</html>
