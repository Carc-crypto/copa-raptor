<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Control - Copa Raptor 2026</title>
  <link rel="stylesheet" href="admin.css?v=1000" />
</head>
<body>

  
  <section id="loginSection">
    <h2>Copa Raptor 2026 - Acceso Admin</h2>
    <form id="loginForm">
      <input type="email" id="adminEmail" placeholder="Correo de Administrador" required />
      <input type="password" id="adminPassword" placeholder="Contraseña" required />
      <button type="submit" class="btn-action">Iniciar Sesión</button>
    </form>
    <p id="loginMessage"></p>
  </section>

  
  <div id="dashboard" style="display: none;">

  
  <div class="header-box">
    <header class="dashboard-header">
      <div class="header-title-group">
        <img src="copa_raptor_logo.jpeg" alt="Copa Raptor 2026 Logo" class="header-logo" />
        <div>
          <h1>Panel de Control</h1>
          <span class="header-subtitle">Copa Raptor 2026</span>
        </div>
      </div>
      <button id="logoutButton" class="logout">Cerrar Sesión</button>
    </header>
  </div>

  
  <section class="participants-box">
    <div class="participants-box-header">
      <h2>Lista de Participantes (<span id="participantCount">0</span>)</h2>
    </div>
    <hr class="fade-divider" />
    <p id="dashboardMessage"></p>
    <div id="participantsContainer" class="participants-container"></div>
  </section>

  
  <hr class="divider" />

  
  <section class="admin-section">
    <h2>Gestión de Brackets</h2>
    <div class="admin-actions">
      <button id="btn-generate-brackets" class="btn-action">Generar Brackets</button>
      <button id="btn-reset-brackets" class="btn-danger">Resetear Brackets</button>
    </div>

    <div class="brackets-wrapper">
      <div class="bracket-column">
        <h3>Winners Bracket</h3>
        <div id="winners-container"></div>
      </div>

      <div class="bracket-column">
        <h3>Losers Bracket</h3>
        <div id="losers-container"></div>
      </div>

      <div class="bracket-column">
        <h3>Grand Finals</h3>
        <div id="grand-finals-container"></div>
      </div>
    </div>
  </section>

</div>
  
  <div id="stageModal" class="modal" style="display: none;">
    <div class="modal-content">
      <h3>Selección / Ban de Escenario</h3>
      <p id="stageInstruction"></p>
      <div id="stagesContainer" class="stages-grid"></div>
      <button id="btnConfirmStageAction" class="btn-action" style="margin-top: 15px;">Confirmar</button>
    </div>
  </div>

  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js?v=1000"></script>
</body>
</html>
