<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Copa Raptor 2026</title>

  <link rel="stylesheet" href="admin.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js" defer></script>
</head>

<body>

  <main class="admin-page">

    <section id="loginSection" class="login-card">

      <h2>COPA RAPTOR 2026</h2>
      <p class="login-subtitle">ACCESO DE ADMINISTRADOR</p>

      <form id="loginForm">

        <div class="form-group">
          <label for="adminEmail">Correo</label>
          <input
            type="email"
            id="adminEmail"
            placeholder="admin@coparaptor.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="adminPassword">Contraseña</label>
          <input
            type="password"
            id="adminPassword"
            placeholder="••••••••"
            required
          >
        </div>

        <button type="submit" class="btn-main">
          INICIAR SESIÓN
        </button>

      </form>

      <p id="loginMessage" class="login-message"></p>

    </section>


    <section id="dashboard" class="dashboard">

      <header class="dashboard-header">

        <div>
          <h1>GESTIÓN DE BRACKETS</h1>
          <p>⚡ COPA RAPTOR 2026</p>
        </div>

        <button id="logoutButton" class="btn-logout">
          CERRAR SESIÓN
        </button>

      </header>


      <div id="dashboardMessage" class="dashboard-message"></div>


      <section class="admin-actions">

        <button id="btn-generate-brackets" class="btn-action">
          ⚡ GENERAR BRACKETS
        </button>

        <button id="btn-reset-brackets" class="btn-danger">
          RESETear BRACKETS
        </button>

      </section>


      <section class="participants-box">

        <div class="section-title">
          <h2>PARTICIPANTES REGISTRADOS</h2>
          <span id="participantCount" class="count-badge">0</span>
        </div>

        <div id="participantsContainer" class="participants-container"></div>

      </section>


      <section class="brackets-section">

        <div class="section-title main-bracket-title">
          <h2>GESTIÓN DE ENFRENTAMIENTOS</h2>
        </div>


        <div class="brackets-wrapper">

          <div class="bracket-column winners-column">

            <div class="bracket-heading">
              <span class="bracket-icon">🏆</span>
              <div>
                <h3>WINNERS BRACKET</h3>
                <p>Los ganadores continúan invictos</p>
              </div>
            </div>

            <div id="winners-container" class="sets-container"></div>

          </div>


          <div class="bracket-column losers-column">

            <div class="bracket-heading">
              <span class="bracket-icon">🔥</span>
              <div>
                <h3>LOSERS BRACKET</h3>
                <p>Una segunda oportunidad</p>
              </div>
            </div>

            <div id="losers-container" class="sets-container"></div>

          </div>


          <div class="bracket-column finals-column">

            <div class="bracket-heading">
              <span class="bracket-icon">👑</span>
              <div>
                <h3>GRAND FINALS</h3>
                <p>Campeonato y bracket reset</p>
              </div>
            </div>

            <div id="grand-finals-container" class="sets-container"></div>

          </div>

        </div>

      </section>

    </section>

  </main>

</body>
</html>
