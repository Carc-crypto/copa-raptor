<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Copa Raptor</title>
  <style>
    :root {
      --bg: #020812;
      --panel: #071525;
      --gold: #f5b52e;
      --text: #f5f7fb;
      --muted: #9eacbd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      background: #020812;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .login-box {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      background: var(--panel);
      border: 1px solid var(--gold);
      border-radius: 8px;
      text-align: center;
    }
    .login-box h1 { color: var(--gold); margin-bottom: 20px; font-size: 22px; }
    .login-box input {
      width: 100%; padding: 12px; margin-bottom: 12px;
      background: #020a14; border: 1px solid #333; color: #fff; border-radius: 4px;
    }
    .login-box button {
      width: 100%; padding: 12px; background: var(--gold); border: none;
      font-weight: bold; cursor: pointer; border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h1>Panel de Administración</h1>
    <form id="loginForm">
      <input type="email" placeholder="Correo electrónico" required>
      <input type="password" placeholder="Contraseña" required>
      <button type="submit">INGRESAR</button>
    </form>
  </div>

</body>
</html>
