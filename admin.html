<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Copa Raptor 2026 | Administrador
  </title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Orbitron:wght@500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="admin.css"
  >

</head>


<body>


  <main class="admin-container">


    <section
      id="loginSection"
      class="login-box"
    >

      <img
        src="assets/copa-raptor-2026.jpeg"
        alt="Copa Raptor"
      >

      <h1>
        PANEL DE ADMINISTRADOR
      </h1>

      <p>
        Copa Raptor 2026
      </p>


      <form id="loginForm">

        <input
          type="email"
          id="adminEmail"
          placeholder="Correo del administrador"
          required
        >

        <input
          type="password"
          id="adminPassword"
          placeholder="Contraseña"
          required
        >

        <button type="submit">
          INICIAR SESIÓN
        </button>

      </form>


      <p
        id="loginMessage"
        class="message"
      ></p>

    </section>



    <section
      id="dashboard"
      class="dashboard"
      style="display:none;"
    >

      <div class="dashboard-header">

        <div>

          <p class="eyebrow">
            COPA RAPTOR 2026
          </p>

          <h1>
            PARTICIPANTES
          </h1>

        </div>


        <button
          id="logoutButton"
          class="logout"
        >
          CERRAR SESIÓN
        </button>

      </div>



      <div class="counter">

        <span>
          PARTICIPANTES REGISTRADOS
        </span>

        <strong id="participantCount">
          0
        </strong>

      </div>



      <div
        id="participantsContainer"
        class="participants-container"
      ></div>


      <p
        id="dashboardMessage"
        class="message"
      ></p>

    </section>


  </main>



  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-config.js"></script>

  <script src="admin.js"></script>


</body>

</html>
